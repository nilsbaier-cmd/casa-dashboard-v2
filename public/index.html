<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F3FF" />
    <meta name="description" content="CASA INAD Analysis Dashboard - Enhanced Analysis with Priority Classification" />

    <!--
      Security headers. GitHub Pages cannot set real HTTP response headers, so we
      use the <meta> equivalents the browser honours. The CSP is scoped to exactly
      what the app needs:
        - script/style: self + inline (CRA injects an inline runtime + many
          components use inline styles; recharts also emits inline styles).
        - img/connect: self + data/blob (html2canvas, CSV/PNG export) and
          unpkg.com (3D globe textures: earth, topology, night-sky).
        - font: self + Google Fonts; object-src none + base-uri self harden
          against injected plugins/base-tag hijacking.
      Note: frame-ancestors / X-Frame-Options only work as real HTTP headers, so
      they are intentionally omitted here. Clickjacking risk is low for a no-auth,
      read-only dashboard; see SECURITY.md. If the globe textures are later
      self-hosted, drop unpkg.com from img-src/connect-src.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        form-action 'self';
        img-src 'self' data: blob: https://unpkg.com https://*.unpkg.com;
        connect-src 'self' https://unpkg.com https://*.unpkg.com;
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        worker-src 'self' blob:;
        upgrade-insecure-requests
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Inline SVG favicon (teal tile + plane) — avoids a 404 and an extra request -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230D9488'/%3E%3Cpath d='M16 34l32-12-9 26-7-9-7 5z' fill='white'/%3E%3C/svg%3E"
    />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>CASA Dashboard</title>
    
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #F5F3FF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader {
        width: 48px;
        height: 48px;
        border: 3px solid #EDE9FE;
        border-top-color: #7C3AED;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loading-text {
        margin-top: 16px;
        font-family: Inter, sans-serif;
        color: #6B7280;
        font-size: 14px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="loading-screen">
      <div class="loader"></div>
      <div class="loading-text">Loading CASA Dashboard...</div>
    </div>
    
    <div id="root"></div>
    
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loading-screen').classList.add('hidden');
        }, 300);
      });
    </script>
  </body>
</html>
